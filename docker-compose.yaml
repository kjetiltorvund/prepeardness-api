name: "prepeardness-api"

services:
  db:
    image: supabase/postgres:17.6.1.072
    container_name: supabase-postgres
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    command: postgres -c config_file=/etc/postgresql/postgresql.conf

  app:
    container_name: prepeardness-api
    depends_on:
      - db
    build: .
    ports:
      - 8080:8080
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: postgres_db