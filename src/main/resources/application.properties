#spring.datasource.url=jdbc:postgresql://localhost:5432/postgres

#logging.level.org.springframework.boot.autoconfigure=ERROR

# Swagger
# Swagger UI path
springdoc.swagger-ui.path=/swagger-ui.html
# API docs path
springdoc.api-docs.path=/v3/api-docs
# Enable/disable API docs
springdoc.api-docs.enabled=true
# Enable/disable Swagger UI
springdoc.swagger-ui.enabled=true
mail.username=${MAIL_USERNAME}
mail.password=${MAIL_PASSWORD}
# Supabase settings
supabase.url=${SUPABASE_URL}
supabase.apiKey=${SUPABASE_SECRET_API_KEY}

# Tells Spring Boot that it's behind a reverse proxy
server.forward-headers-strategy=framework

# Expose only the minimal health endpoint used by Docker and the reverse proxy.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Activate standardized error messages
spring.mvc.problem-details.enabled=true
