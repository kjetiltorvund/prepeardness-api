#spring.datasource.url=jdbc:postgresql://localhost:5432/postgres

#logging.level.org.springframework.boot.autoconfigure=ERROR

# Swagger
# Swagger UI path
springdoc.swagger-ui.path=/swagger-ui.html
# API docs path
springdoc.api-docs.path=/v3/api-docs
# Enable/disable API docs
springdoc.api-docs.enabled=true
# Enable/disable Swagger UI
springdoc.swagger-ui.enabled=true
mail.username=${MAIL_USERNAME}
mail.password=${MAIL_PASSWORD}
# Supabase settings
supabase.url=${SUPABASE_URL}
supabase.apiKey=${SUPABASE_SECRET_API_KEY}

# Tells Spring Boot that it's behind a reverse proxy
server.forward-headers-strategy=framework

# Expose only the minimal health endpoint used by Docker and the reverse proxy.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# Activate standardized error messages
spring.mvc.problem-details.enabled=true

# Security: Google ID tokens (OAuth2 resource server)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com
# Must be the OAuth client id of the web app, otherwise tokens issued to any Google app would be accepted
spring.security.oauth2.resourceserver.jwt.audiences=${GOOGLE_CLIENT_ID}
# Comma-separated Google account emails that are always admins, also if the app_users table is unavailable.
# Other users are managed in the Supabase table app_users.
app.security.admins=${APP_ADMINS:}
# How long a lookup in app_users is cached
app.security.user-cache-ttl=5m
