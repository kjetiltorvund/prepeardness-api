name: Deploy Java Lambda

on:
  push:
    paths:
      - 'backend/**'
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      FUNCTION_NAME: prepeardness-backend  # This should match Pulumi's exported function name
      AWS_REGION: eu-north-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build with Maven
        run: mvn clean package -Plambda
        working-directory: backend  # adjust path if needed

      - name: Zip Lambda JAR
        run: |
          mkdir -p lambda-dist
          cp backend/build/libs/*all.jar lambda-dist/lambda.jar
          cd lambda-dist && zip lambda.zip lambda.jar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::$secrets.AWS_DEPLOYMENT_ACCOUNT_ID:role/github-deploy-lambda-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Lambda
        run: |
          aws lambda update-function-code \
            --function-name $FUNCTION_NAME \
            --zip-file fileb://lambda-dist/lambda.zip
