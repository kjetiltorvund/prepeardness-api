name: Deploy to Kamatera VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: '21'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Build with Maven
        run: mvn clean package -DskipTests
        env:
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          SUPABASE_PUB_API_KEY: ${{ secrets.SUPABASE_PUB_API_KEY }}
          SUPABASE_SECRET_API_KEY: ${{ secrets.SUPABASE_SECRET_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      
      - name: Run tests
        run: mvn test
        env:
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          SUPABASE_PUB_API_KEY: ${{ secrets.SUPABASE_PUB_API_KEY }}
          SUPABASE_SECRET_API_KEY: ${{ secrets.SUPABASE_SECRET_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
          retention-days: 1

  build-and-push-image:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix={{branch}}-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Image digest
        run: echo "✓ Image pushed with digest ${{ steps.build.outputs.digest }}"

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push-image
    environment:
      name: production
      url: http://45-248-37-116.cloud-xip.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
      
      - name: Copy deployment files to VPS
        run: |
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            docker-compose.yaml \
            scripts/deploy.sh \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/prepeardness-api/
          
          # Copy nginx configuration
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "mkdir -p /opt/prepeardness-api/nginx/conf.d"
          
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            nginx/conf.d/app.conf \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/prepeardness-api/nginx/conf.d/
          
          # Make deploy script executable
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "chmod +x /opt/prepeardness-api/deploy.sh"
      
      - name: Update environment variables on VPS
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
          
          cd /opt/prepeardness-api
          
          cat > .env << EOF
          SPRING_PROFILES_ACTIVE=prod
          SERVER_PORT=8080
          
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DATABASE_USERNAME=postgres
          DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
          
          MAIL_HOST=smtp.gmail.com
          MAIL_PORT=587
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_API_KEY=${{ secrets.SUPABASE_SECRET_API_KEY }}
          
          LOGGING_LEVEL_ROOT=INFO
          LOGGING_LEVEL_COM_BEREDSKAP=DEBUG
          EOF
          
          chmod 600 .env
          
          ENDSSH
      
      - name: Deploy application
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << ENDSSH
          
          cd /opt/prepeardness-api
          
          export IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          export IMAGE_TAG="latest"
          export GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          export GITHUB_ACTOR="${{ github.actor }}"
          
          ./deploy.sh
          
          ENDSSH
      
      - name: Verify deployment
        run: |
          echo "Waiting for application to be ready..."
          sleep 10
          
          MAX_RETRIES=15
          RETRY_DELAY=4
          
          for i in $(seq 1 $MAX_RETRIES); do
            if curl -sf http://${{ secrets.VPS_HOST }}/actuator/health > /dev/null 2>&1; then
              echo "✓ Health check passed"
              curl -s http://${{ secrets.VPS_HOST }}/actuator/health
              exit 0
            else
              echo "Health check attempt $i/$MAX_RETRIES failed, retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done
          
          echo "❌ Health check failed after $MAX_RETRIES attempts"
          exit 1
      
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    
    steps:
      - name: Deployment Success
        if: needs.deploy.result == 'success'
        run: |
          echo "🚀 Deployment successful!"
          echo "Application URL: http://45-248-37-116.cloud-xip.com"
          echo "Health: http://45-248-37-116.cloud-xip.com/actuator/health"
          echo "Swagger UI: http://45-248-37-116.cloud-xip.com/swagger-ui.html"
      
      - name: Deployment Failed
        if: needs.deploy.result != 'success'
        run: |
          echo "❌ Deployment failed"
          exit 1
