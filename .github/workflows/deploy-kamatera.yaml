name: Build and deploy to Kamatera

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-kamatera
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
  IMAGE_TAG: sha-${{ github.sha }}
  JAVA_VERSION: "21"
  PRODUCTION_URL: https://45-248-37-116.cloud-xip.com

jobs:
  build-test-push:
    name: Test, build, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run tests and package
        env:
          MAIL_USERNAME: ci@example.invalid
          MAIL_PASSWORD: ci-placeholder
          SUPABASE_URL: https://example.invalid
          SUPABASE_SECRET_API_KEY: ci-placeholder
          SUPABASE_PUB_API_KEY: ci-placeholder
        run: mvn --batch-mode clean verify

      - name: Build image
        run: docker build --tag "${IMAGE_REPOSITORY}:${IMAGE_TAG}" .

      - name: Smoke-test container health
        env:
          MAIL_USERNAME: ci@example.invalid
          MAIL_PASSWORD: ci-placeholder
          SUPABASE_URL: https://example.invalid
          SUPABASE_SECRET_API_KEY: ci-placeholder
        run: |
          set -euo pipefail
          docker run --detach --name preparedness-smoke \
            --env MAIL_USERNAME --env MAIL_PASSWORD \
            --env SUPABASE_URL --env SUPABASE_SECRET_API_KEY \
            "${IMAGE_REPOSITORY}:${IMAGE_TAG}"
          trap 'docker logs preparedness-smoke; docker rm --force preparedness-smoke' EXIT
          for attempt in $(seq 1 45); do
            status="$(docker inspect --format '{{.State.Health.Status}}' preparedness-smoke)"
            if [[ "$status" == "healthy" ]]; then exit 0; fi
            if [[ "$status" == "unhealthy" ]]; then exit 1; fi
            sleep 2
          done
          exit 1

      - name: Validate Compose configuration
        env:
          MAIL_USERNAME: ci@example.invalid
          MAIL_PASSWORD: ci-placeholder
          SUPABASE_URL: https://example.invalid
          SUPABASE_SECRET_API_KEY: ci-placeholder
        run: docker compose config --quiet

      - name: Validate Nginx configuration
        run: |
          set -euo pipefail
          certificate_dir="${RUNNER_TEMP}/letsencrypt/live/45-248-37-116.cloud-xip.com"
          mkdir -p "$certificate_dir" "${RUNNER_TEMP}/certbot"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=45-248-37-116.cloud-xip.com' \
            -keyout "${certificate_dir}/privkey.pem" \
            -out "${certificate_dir}/fullchain.pem" >/dev/null 2>&1
          docker run --rm \
            -v "${PWD}/nginx/conf.d:/etc/nginx/conf.d:ro" \
            -v "${RUNNER_TEMP}/letsencrypt:/etc/letsencrypt:ro" \
            -v "${RUNNER_TEMP}/certbot:/var/www/certbot:ro" \
            nginx:1.27-alpine nginx -t

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable image
        run: docker push "${IMAGE_REPOSITORY}:${IMAGE_TAG}"

  deploy:
    name: Deploy production
    needs: build-test-push
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://45-248-37-116.cloud-xip.com
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Create production environment file
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_API_KEY: ${{ secrets.SUPABASE_SECRET_API_KEY }}
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/production.env"
          : > "$output"
          chmod 600 "$output"
          write_value() {
            local name="$1" value="$2"
            if [[ -z "$value" || "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              printf 'Invalid or missing production value: %s\n' "$name" >&2
              exit 1
            fi
            value="${value//\'/\\\'}"
            printf "%s='%s'\n" "$name" "$value" >> "$output"
          }
          printf '%s\n' \
            'SPRING_PROFILES_ACTIVE=prod' \
            'SERVER_PORT=8080' \
            'LOGGING_LEVEL_ROOT=INFO' \
            'LOGGING_LEVEL_COM_BEREDSKAP=INFO' >> "$output"
          write_value MAIL_USERNAME "$MAIL_USERNAME"
          write_value MAIL_PASSWORD "$MAIL_PASSWORD"
          write_value SUPABASE_URL "$SUPABASE_URL"
          write_value SUPABASE_SECRET_API_KEY "$SUPABASE_SECRET_API_KEY"

      - name: Copy deployment files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh_options=(-i ~/.ssh/deploy_key -o BatchMode=yes)
          scp "${ssh_options[@]}" docker-compose.yaml scripts/deploy.sh \
            "${VPS_USER}@${VPS_HOST}:/opt/prepeardness-api/"
          scp "${ssh_options[@]}" nginx/conf.d/app.conf \
            "${VPS_USER}@${VPS_HOST}:/opt/prepeardness-api/nginx/conf.d/app.conf"
          scp "${ssh_options[@]}" "${RUNNER_TEMP}/production.env" \
            "${VPS_USER}@${VPS_HOST}:/opt/prepeardness-api/.env.upload"
          ssh "${ssh_options[@]}" "${VPS_USER}@${VPS_HOST}" \
            'install -m 600 /opt/prepeardness-api/.env.upload /opt/prepeardness-api/.env && rm /opt/prepeardness-api/.env.upload && chmod +x /opt/prepeardness-api/deploy.sh'

      - name: Authenticate VPS to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            "${VPS_USER}@${VPS_HOST}" "docker login ghcr.io --username '${GITHUB_ACTOR}' --password-stdin"

      - name: Deploy immutable image
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "${VPS_USER}@${VPS_HOST}" \
            "IMAGE_REPOSITORY='${IMAGE_REPOSITORY}' IMAGE_TAG='${IMAGE_TAG}' /opt/prepeardness-api/deploy.sh"

      - name: Verify public surface
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if response="$(curl --fail --silent --show-error "${PRODUCTION_URL}/actuator/health")" \
              && [[ "$response" == *'"status":"UP"'* ]]; then
              break
            fi
            if [[ "$attempt" -eq 20 ]]; then exit 1; fi
            sleep 3
          done
          [[ "$(curl --silent --output /dev/null --write-out '%{http_code}' "${PRODUCTION_URL}/swagger-ui.html")" == "404" ]]
          [[ "$(curl --silent --output /dev/null --write-out '%{http_code}' "${PRODUCTION_URL}/actuator/info")" == "404" ]]
          [[ "$(curl --silent --output /dev/null --write-out '%{http_code}' http://45-248-37-116.cloud-xip.com/)" == "301" ]]
          if curl --silent --fail --connect-timeout 3 http://45.248.37.116:8080/ >/dev/null; then
            echo 'Port 8080 is publicly reachable' >&2
            exit 1
          fi

      - name: Remove local deployment credentials
        if: always()
        run: rm -f ~/.ssh/deploy_key "${RUNNER_TEMP}/production.env"
